<!DOCTYPE html>
<html>
<head>
  <title>Rotation Debug</title>
</head>
<body>
  <pre id="results">Running...</pre>
  <script>
    const DEG_TO_RAD = 0.0174533;

    // Original polar method (exact copy from code)
    function movePolar(animalDir, animalX, animalY, eyeX, eyeY) {
      const angle = Math.atan(eyeX / (eyeY + 0.001)) / DEG_TO_RAD;
      const dist = Math.sqrt(eyeX ** 2 + eyeY ** 2);
      const adjustedAngle = eyeX < 0 ? angle + 180 : angle;

      const x = animalX + dist * Math.cos(DEG_TO_RAD * (adjustedAngle + animalDir));
      const y = animalY + dist * Math.sin(DEG_TO_RAD * (adjustedAngle + animalDir));
      return { x, y };
    }

    // Let's trace through the math step by step
    function debug(animalDir, animalX, animalY, eyeX, eyeY) {
      console.log(`\n=== Input: dir=${animalDir}, pos=(${animalX},${animalY}), eye=(${eyeX},${eyeY}) ===`);

      // Original method step by step
      const angle = Math.atan(eyeX / (eyeY + 0.001)) / DEG_TO_RAD;
      console.log(`atan(${eyeX}/${eyeY+0.001}) = ${Math.atan(eyeX / (eyeY + 0.001))} rad = ${angle} deg`);

      const dist = Math.sqrt(eyeX ** 2 + eyeY ** 2);
      console.log(`dist = sqrt(${eyeX}^2 + ${eyeY}^2) = ${dist}`);

      const adjustedAngle = eyeX < 0 ? angle + 180 : angle;
      console.log(`adjustedAngle = ${adjustedAngle} (eyeX < 0 ? ${eyeX < 0})`);

      const finalAngle = adjustedAngle + animalDir;
      console.log(`finalAngle = ${adjustedAngle} + ${animalDir} = ${finalAngle}`);

      const x = animalX + dist * Math.cos(DEG_TO_RAD * finalAngle);
      const y = animalY + dist * Math.sin(DEG_TO_RAD * finalAngle);
      console.log(`result: (${x}, ${y})`);

      return { x, y, angle, adjustedAngle, finalAngle, dist };
    }

    // Test with simple cases
    let results = 'Rotation Debug\n==============\n\n';

    // Case 1: Eye directly forward (eyeX=0, eyeY=10), facing right (dir=0)
    results += 'Case 1: Eye forward (0, 10), facing dir=0\n';
    let p = debug(0, 100, 100, 0, 10);
    results += `  Polar: (${p.x.toFixed(2)}, ${p.y.toFixed(2)})\n`;
    results += `  Expected: eye should be at (100, 110) - 10 units in +Y direction\n\n`;

    // Case 2: Eye directly forward (eyeX=0, eyeY=10), facing down (dir=90)
    results += 'Case 2: Eye forward (0, 10), facing dir=90\n';
    p = debug(90, 100, 100, 0, 10);
    results += `  Polar: (${p.x.toFixed(2)}, ${p.y.toFixed(2)})\n`;
    results += `  If dir=90 means facing +Y, eye at (100, 110)\n`;
    results += `  If dir=90 means rotated 90deg CW, eye at (110, 100)\n\n`;

    // Case 3: Eye to the right (eyeX=10, eyeY=0), facing forward (dir=0)
    results += 'Case 3: Eye right (10, 0), facing dir=0\n';
    p = debug(0, 100, 100, 10, 0);
    results += `  Polar: (${p.x.toFixed(2)}, ${p.y.toFixed(2)})\n\n`;

    // Case 4: Eye forward-right diagonal (eyeX=10, eyeY=10), facing forward (dir=0)
    results += 'Case 4: Eye diagonal (10, 10), facing dir=0\n';
    p = debug(0, 100, 100, 10, 10);
    results += `  Polar: (${p.x.toFixed(2)}, ${p.y.toFixed(2)})\n\n`;

    // Now understand the coordinate system
    results += '=== Understanding the coordinate system ===\n';
    results += 'When eyeY > 0, atan gives small angle (near 0)\n';
    results += 'adjustedAngle = that small angle\n';
    results += 'So eyeY being positive means "forward" relative to angle 0\n';
    results += 'cos(0) = 1, sin(0) = 0, so at dir=0 and angle=0:\n';
    results += '  x = animalX + dist * cos(0) = animalX + dist\n';
    results += '  y = animalY + dist * sin(0) = animalY\n';
    results += 'So "forward" (eyeY) maps to +X direction when dir=0\n\n';

    // The correct matrix then:
    results += '=== Correct rotation matrix ===\n';
    results += 'If eyeY=forward maps to +X at dir=0, and eyeX=strafe maps to +Y at dir=0:\n';
    results += '  x = animalX + eyeY * cos(dir) - eyeX * sin(dir)\n';
    results += '  y = animalY + eyeY * sin(dir) + eyeX * cos(dir)\n\n';

    function moveMatrixCorrected(animalDir, animalX, animalY, eyeX, eyeY) {
      const rad = animalDir * DEG_TO_RAD;
      const cos = Math.cos(rad);
      const sin = Math.sin(rad);
      const x = animalX + eyeY * cos - eyeX * sin;
      const y = animalY + eyeY * sin + eyeX * cos;
      return { x, y };
    }

    results += 'Testing corrected matrix:\n';
    for (let i = 1; i <= 4; i++) {
      let eyeX, eyeY, dir;
      if (i === 1) { eyeX = 0; eyeY = 10; dir = 0; }
      if (i === 2) { eyeX = 0; eyeY = 10; dir = 90; }
      if (i === 3) { eyeX = 10; eyeY = 0; dir = 0; }
      if (i === 4) { eyeX = 10; eyeY = 10; dir = 0; }

      const polar = movePolar(dir, 100, 100, eyeX, eyeY);
      const matrix = moveMatrixCorrected(dir, 100, 100, eyeX, eyeY);
      const xDiff = Math.abs(polar.x - matrix.x);
      const yDiff = Math.abs(polar.y - matrix.y);
      const match = (xDiff < 0.01 && yDiff < 0.01) ? 'OK' : `DIFF`;
      results += `Case ${i}: eye=(${eyeX},${eyeY}) dir=${dir}\n`;
      results += `  Polar:  (${polar.x.toFixed(4)}, ${polar.y.toFixed(4)})\n`;
      results += `  Matrix: (${matrix.x.toFixed(4)}, ${matrix.y.toFixed(4)}) [${match}]\n`;
    }

    document.getElementById('results').textContent = results;
  </script>
</body>
</html>
