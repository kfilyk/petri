<!DOCTYPE html>
<html>
<head>
  <title>Rotation Method Benchmark</title>
</head>
<body>
  <pre id="results">Running...</pre>
  <script>
    const ITERATIONS = 50_000_000;
    const DEG_TO_RAD = 0.0174533;

    // Generate test data
    const DATA_SIZE = 10000;
    const animalDirs = new Float64Array(DATA_SIZE);
    const animalXs = new Float64Array(DATA_SIZE);
    const animalYs = new Float64Array(DATA_SIZE);
    const eyeXs = new Float64Array(DATA_SIZE);
    const eyeYs = new Float64Array(DATA_SIZE);

    for (let i = 0; i < DATA_SIZE; i++) {
      animalDirs[i] = Math.random() * 360;
      animalXs[i] = Math.random() * 1000;
      animalYs[i] = Math.random() * 1000;
      eyeXs[i] = (Math.random() - 0.5) * 20;
      eyeYs[i] = (Math.random() - 0.5) * 20;
    }

    // Prevent dead code elimination
    let sinkX = 0;
    let sinkY = 0;

    // Method 1: Original polar conversion
    function movePolar(animalDir, animalX, animalY, eyeX, eyeY) {
      const angle = Math.atan(eyeX / (eyeY + 0.001)) / DEG_TO_RAD;
      const dist = Math.sqrt(eyeX ** 2 + eyeY ** 2);
      const adjustedAngle = eyeX < 0 ? angle + 180 : angle;

      const x = animalX + dist * Math.cos(DEG_TO_RAD * (adjustedAngle + animalDir));
      const y = animalY + dist * Math.sin(DEG_TO_RAD * (adjustedAngle + animalDir));
      return { x, y };
    }

    // Method 2: Rotation matrix (corrected: eyeY is forward, eyeX is strafe)
    function moveMatrix(animalDir, animalX, animalY, eyeX, eyeY) {
      const rad = animalDir * DEG_TO_RAD;
      const cos = Math.cos(rad);
      const sin = Math.sin(rad);
      const x = animalX + eyeY * cos + eyeX * sin;
      const y = animalY + eyeY * sin - eyeX * cos;
      return { x, y };
    }

    // Warmup
    for (let i = 0; i < 100000; i++) {
      const idx = i % DATA_SIZE;
      const p = movePolar(animalDirs[idx], animalXs[idx], animalYs[idx], eyeXs[idx], eyeYs[idx]);
      const m = moveMatrix(animalDirs[idx], animalXs[idx], animalYs[idx], eyeXs[idx], eyeYs[idx]);
      sinkX += p.x + m.x;
      sinkY += p.y + m.y;
    }
    sinkX = 0;
    sinkY = 0;

    // Benchmark polar
    const t1 = performance.now();
    for (let i = 0; i < ITERATIONS; i++) {
      const idx = i % DATA_SIZE;
      const p = movePolar(animalDirs[idx], animalXs[idx], animalYs[idx], eyeXs[idx], eyeYs[idx]);
      sinkX += p.x;
      sinkY += p.y;
    }
    const polarTime = performance.now() - t1;
    sinkX = 0;
    sinkY = 0;

    // Benchmark matrix
    const t2 = performance.now();
    for (let i = 0; i < ITERATIONS; i++) {
      const idx = i % DATA_SIZE;
      const m = moveMatrix(animalDirs[idx], animalXs[idx], animalYs[idx], eyeXs[idx], eyeYs[idx]);
      sinkX += m.x;
      sinkY += m.y;
    }
    const matrixTime = performance.now() - t2;
    sinkX = 0;
    sinkY = 0;

    // Benchmark inline polar (no function call)
    const t3 = performance.now();
    for (let i = 0; i < ITERATIONS; i++) {
      const idx = i % DATA_SIZE;
      const animalDir = animalDirs[idx];
      const animalX = animalXs[idx];
      const animalY = animalYs[idx];
      const eyeX = eyeXs[idx];
      const eyeY = eyeYs[idx];

      const angle = Math.atan(eyeX / (eyeY + 0.001)) / DEG_TO_RAD;
      const dist = Math.sqrt(eyeX ** 2 + eyeY ** 2);
      const adjustedAngle = eyeX < 0 ? angle + 180 : angle;

      sinkX += animalX + dist * Math.cos(DEG_TO_RAD * (adjustedAngle + animalDir));
      sinkY += animalY + dist * Math.sin(DEG_TO_RAD * (adjustedAngle + animalDir));
    }
    const inlinePolarTime = performance.now() - t3;
    sinkX = 0;
    sinkY = 0;

    // Benchmark inline matrix (no function call) - corrected formula
    const t4 = performance.now();
    for (let i = 0; i < ITERATIONS; i++) {
      const idx = i % DATA_SIZE;
      const animalDir = animalDirs[idx];
      const animalX = animalXs[idx];
      const animalY = animalYs[idx];
      const eyeX = eyeXs[idx];
      const eyeY = eyeYs[idx];

      const rad = animalDir * DEG_TO_RAD;
      const cos = Math.cos(rad);
      const sin = Math.sin(rad);
      sinkX += animalX + eyeY * cos + eyeX * sin;
      sinkY += animalY + eyeY * sin - eyeX * cos;
    }
    const inlineMatrixTime = performance.now() - t4;

    // Results
    const times = [
      { name: 'Polar conversion (function)', time: polarTime },
      { name: 'Rotation matrix (function)', time: matrixTime },
      { name: 'Polar conversion (inline)', time: inlinePolarTime },
      { name: 'Rotation matrix (inline)', time: inlineMatrixTime },
    ];
    times.sort((a, b) => a.time - b.time);

    let results = `Rotation Method Benchmark — ${(ITERATIONS / 1e6).toFixed(0)}M iterations\n`;
    results += `=`.repeat(60) + '\n\n';

    for (const t of times) {
      const bar = '#'.repeat(Math.round(t.time / times[times.length - 1].time * 30));
      const pad = t.name.padEnd(35);
      results += `${pad} ${t.time.toFixed(1).padStart(8)}ms  ${bar}\n`;
    }

    results += `\nFastest: ${times[0].name}`;
    results += `\nSlowest: ${times[times.length - 1].name}`;
    results += `\nSpeedup: ${(times[times.length - 1].time / times[0].time).toFixed(2)}x`;

    // Verify correctness (spot check a few values)
    results += '\n\n--- Correctness check ---\n';
    for (let i = 0; i < 5; i++) {
      const p = movePolar(animalDirs[i], animalXs[i], animalYs[i], eyeXs[i], eyeYs[i]);
      const m = moveMatrix(animalDirs[i], animalXs[i], animalYs[i], eyeXs[i], eyeYs[i]);
      const xDiff = Math.abs(p.x - m.x);
      const yDiff = Math.abs(p.y - m.y);
      const match = (xDiff < 0.001 && yDiff < 0.001) ? 'OK' : `DIFF x:${xDiff.toFixed(4)} y:${yDiff.toFixed(4)}`;
      results += `Test ${i}: polar(${p.x.toFixed(2)}, ${p.y.toFixed(2)}) vs matrix(${m.x.toFixed(2)}, ${m.y.toFixed(2)}) [${match}]\n`;
    }

    document.getElementById('results').textContent = results;
    console.log(results);
  </script>
</body>
</html>
