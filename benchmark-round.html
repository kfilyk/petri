<!DOCTYPE html>
<html>
<head>
  <title>round() Benchmark</title>
</head>
<body>
  <pre id="results">Running...</pre>
  <script>
    const ITERATIONS = 100_000_000;

    // Generate test data: mix of positive and negative floats
    const DATA_SIZE = 10000;
    const data = new Float64Array(DATA_SIZE);
    for (let i = 0; i < DATA_SIZE; i++) {
      data[i] = (Math.random() - 0.5) * 200;
    }

    // Method 1: Custom round (same as math.ts)
    function customRound(r) {
      return (r + (r < 0 ? -0.5 : 0.5)) | 0;
    }

    // Method 2: Math.round
    // (just use Math.round directly)

    // Method 3: Local alias of Math.round
    const localRound = Math.round;

    // Method 4: Bitwise floor alternative (add 0.5 then bitwise OR)
    function bitwiseRound(r) {
      return (r + 0.5) | 0;
    }

    // Method 5: Inline custom (same logic, no function call)
    // (done inline in the loop)

    // Prevent dead code elimination
    let sink = 0;

    // Warmup all paths
    for (let i = 0; i < 100000; i++) {
      const v = data[i % DATA_SIZE];
      sink += customRound(v);
      sink += Math.round(v);
      sink += localRound(v);
      sink += bitwiseRound(v);
    }
    sink = 0;

    // Benchmark custom round
    const t1 = performance.now();
    for (let i = 0; i < ITERATIONS; i++) {
      sink += customRound(data[i % DATA_SIZE]);
    }
    const customTime = performance.now() - t1;
    sink = 0;

    // Benchmark Math.round
    const t2 = performance.now();
    for (let i = 0; i < ITERATIONS; i++) {
      sink += Math.round(data[i % DATA_SIZE]);
    }
    const mathRoundTime = performance.now() - t2;
    sink = 0;

    // Benchmark local alias
    const t3 = performance.now();
    for (let i = 0; i < ITERATIONS; i++) {
      sink += localRound(data[i % DATA_SIZE]);
    }
    const localAliasTime = performance.now() - t3;
    sink = 0;

    // Benchmark bitwise (positive-only correct)
    const t4 = performance.now();
    for (let i = 0; i < ITERATIONS; i++) {
      sink += bitwiseRound(data[i % DATA_SIZE]);
    }
    const bitwiseTime = performance.now() - t4;
    sink = 0;

    // Benchmark inline custom (same logic, no call overhead)
    const t5 = performance.now();
    for (let i = 0; i < ITERATIONS; i++) {
      const r = data[i % DATA_SIZE];
      sink += (r + (r < 0 ? -0.5 : 0.5)) | 0;
    }
    const inlineTime = performance.now() - t5;

    // Results
    const times = [
      { name: 'Custom round() [from math.ts]', time: customTime },
      { name: 'Math.round()', time: mathRoundTime },
      { name: 'Local alias (const localRound = Math.round)', time: localAliasTime },
      { name: 'Bitwise (r + 0.5) | 0  [positive only]', time: bitwiseTime },
      { name: 'Inline custom (no function call)', time: inlineTime },
    ];
    times.sort((a, b) => a.time - b.time);

    let results = `round() Benchmark — ${(ITERATIONS / 1e6).toFixed(0)}M iterations\n`;
    results += `=`.repeat(60) + '\n\n';

    for (const t of times) {
      const bar = '#'.repeat(Math.round(t.time / times[times.length - 1].time * 30));
      const pad = t.name.padEnd(47);
      results += `${pad} ${t.time.toFixed(1).padStart(7)}ms  ${bar}\n`;
    }

    results += `\nFastest: ${times[0].name}`;
    results += `\nSlowest: ${times[times.length - 1].name}`;
    results += `\nSpeedup: ${(times[times.length - 1].time / times[0].time).toFixed(2)}x`;

    document.getElementById('results').textContent = results;
    console.log(results);
  </script>
</body>
</html>
