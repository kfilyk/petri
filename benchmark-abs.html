<!DOCTYPE html>
<html>
<head>
  <title>abs() Benchmark</title>
</head>
<body>
  <pre id="results">Running...</pre>
  <script>
    const ITERATIONS = 100_000_000;

    // Generate test data: mix of positive and negative floats
    const DATA_SIZE = 10000;
    const data = new Float64Array(DATA_SIZE);
    for (let i = 0; i < DATA_SIZE; i++) {
      data[i] = (Math.random() - 0.5) * 200;
    }

    // Method 1: Custom abs (same as math.ts)
    function customAbs(x) {
      return x > 0 ? x : -x;
    }

    // Method 2: Math.abs
    // (just use Math.abs directly)

    // Method 3: Local alias of Math.abs
    const localAbs = Math.abs;

    // Method 4: Bitwise (only works for 32-bit integers)
    function bitwiseAbs(x) {
      return (x ^ (x >> 31)) - (x >> 31);
    }

    // Prevent dead code elimination
    let sink = 0;

    // Warmup all paths
    for (let i = 0; i < 100000; i++) {
      const v = data[i % DATA_SIZE];
      sink += customAbs(v);
      sink += Math.abs(v);
      sink += localAbs(v);
      sink += bitwiseAbs(v | 0);
    }
    sink = 0;

    // Benchmark custom abs
    const t1 = performance.now();
    for (let i = 0; i < ITERATIONS; i++) {
      sink += customAbs(data[i % DATA_SIZE]);
    }
    const customTime = performance.now() - t1;
    sink = 0;

    // Benchmark Math.abs
    const t2 = performance.now();
    for (let i = 0; i < ITERATIONS; i++) {
      sink += Math.abs(data[i % DATA_SIZE]);
    }
    const mathAbsTime = performance.now() - t2;
    sink = 0;

    // Benchmark local alias
    const t3 = performance.now();
    for (let i = 0; i < ITERATIONS; i++) {
      sink += localAbs(data[i % DATA_SIZE]);
    }
    const localAliasTime = performance.now() - t3;
    sink = 0;

    // Benchmark bitwise (integer only)
    const t4 = performance.now();
    for (let i = 0; i < ITERATIONS; i++) {
      sink += bitwiseAbs(data[i % DATA_SIZE] | 0);
    }
    const bitwiseTime = performance.now() - t4;
    sink = 0;

    // Benchmark inline ternary (same logic as custom, but not a function call)
    const t5 = performance.now();
    for (let i = 0; i < ITERATIONS; i++) {
      const x = data[i % DATA_SIZE];
      sink += x > 0 ? x : -x;
    }
    const inlineTime = performance.now() - t5;

    // Results
    const times = [
      { name: 'Custom abs()', time: customTime },
      { name: 'Math.abs()', time: mathAbsTime },
      { name: 'Local alias (const localAbs = Math.abs)', time: localAliasTime },
      { name: 'Bitwise (integers only)', time: bitwiseTime },
      { name: 'Inline ternary (x > 0 ? x : -x)', time: inlineTime },
    ];
    times.sort((a, b) => a.time - b.time);

    let results = `abs() Benchmark — ${(ITERATIONS / 1e6).toFixed(0)}M iterations\n`;
    results += `=`.repeat(55) + '\n\n';

    for (const t of times) {
      const bar = '#'.repeat(Math.round(t.time / times[times.length - 1].time * 30));
      const pad = t.name.padEnd(42);
      results += `${pad} ${t.time.toFixed(1).padStart(7)}ms  ${bar}\n`;
    }

    results += `\nFastest: ${times[0].name}`;
    results += `\nSlowest: ${times[times.length - 1].name}`;
    results += `\nSpeedup: ${(times[times.length - 1].time / times[0].time).toFixed(2)}x`;

    document.getElementById('results').textContent = results;
    console.log(results);
  </script>
</body>
</html>
