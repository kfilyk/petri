<!DOCTYPE html>
<html>
<head>
  <title>Shape Drawing Benchmark</title>
</head>
<body>
  <canvas id="canvas" width="1200" height="1200"></canvas>
  <pre id="results">Running...</pre>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const TWOPI = Math.PI * 2;
    const SHAPES = 1000;
    const FRAMES = 200;

    // Generate random shape data (simulating amoebs)
    const xs = new Float64Array(SHAPES);
    const ys = new Float64Array(SHAPES);
    const radii = new Float64Array(SHAPES);
    const dirs = new Float64Array(SHAPES);
    for (let i = 0; i < SHAPES; i++) {
      xs[i] = Math.random() * 1200;
      ys[i] = Math.random() * 1200;
      radii[i] = 3 + Math.random() * 8; // typical amoeb sizes
      dirs[i] = Math.random() * TWOPI;
    }

    // Precompute unit offsets for polygon shapes
    function polyOffsets(sides) {
      const offsets = [];
      for (let i = 0; i < sides; i++) {
        const angle = (TWOPI * i) / sides;
        offsets.push({ cos: Math.cos(angle), sin: Math.sin(angle) });
      }
      return offsets;
    }

    const SQUARE_OFFSETS = polyOffsets(4);
    const HEX_OFFSETS = polyOffsets(6);
    const OCT_OFFSETS = polyOffsets(8);

    // Method 1: arc (current)
    function drawArcs() {
      ctx.fillStyle = '#303030';
      ctx.fillRect(0, 0, 1200, 1200);
      for (let i = 0; i < SHAPES; i++) {
        ctx.fillStyle = '#FF4444';
        ctx.beginPath();
        ctx.arc(xs[i], ys[i], radii[i], 0, TWOPI);
        ctx.fill();
      }
    }

    // Method 2: fillRect (axis-aligned square, cheapest possible)
    function drawRects() {
      ctx.fillStyle = '#303030';
      ctx.fillRect(0, 0, 1200, 1200);
      for (let i = 0; i < SHAPES; i++) {
        ctx.fillStyle = '#FF4444';
        const r = radii[i];
        ctx.fillRect(xs[i] - r, ys[i] - r, r * 2, r * 2);
      }
    }

    // Method 3: Rotated square (4 lineTo)
    function drawSquares() {
      ctx.fillStyle = '#303030';
      ctx.fillRect(0, 0, 1200, 1200);
      for (let i = 0; i < SHAPES; i++) {
        ctx.fillStyle = '#FF4444';
        const x = xs[i], y = ys[i], r = radii[i], d = dirs[i];
        ctx.beginPath();
        ctx.moveTo(
          x + r * SQUARE_OFFSETS[0].cos,
          y + r * SQUARE_OFFSETS[0].sin
        );
        for (let s = 1; s < 4; s++) {
          ctx.lineTo(
            x + r * SQUARE_OFFSETS[s].cos,
            y + r * SQUARE_OFFSETS[s].sin
          );
        }
        ctx.fill();
      }
    }

    // Method 4: Hexagon (6 lineTo)
    function drawHexagons() {
      ctx.fillStyle = '#303030';
      ctx.fillRect(0, 0, 1200, 1200);
      for (let i = 0; i < SHAPES; i++) {
        ctx.fillStyle = '#FF4444';
        const x = xs[i], y = ys[i], r = radii[i];
        ctx.beginPath();
        ctx.moveTo(
          x + r * HEX_OFFSETS[0].cos,
          y + r * HEX_OFFSETS[0].sin
        );
        for (let s = 1; s < 6; s++) {
          ctx.lineTo(
            x + r * HEX_OFFSETS[s].cos,
            y + r * HEX_OFFSETS[s].sin
          );
        }
        ctx.fill();
      }
    }

    // Method 5: Octagon (8 lineTo)
    function drawOctagons() {
      ctx.fillStyle = '#303030';
      ctx.fillRect(0, 0, 1200, 1200);
      for (let i = 0; i < SHAPES; i++) {
        ctx.fillStyle = '#FF4444';
        const x = xs[i], y = ys[i], r = radii[i];
        ctx.beginPath();
        ctx.moveTo(
          x + r * OCT_OFFSETS[0].cos,
          y + r * OCT_OFFSETS[0].sin
        );
        for (let s = 1; s < 8; s++) {
          ctx.lineTo(
            x + r * OCT_OFFSETS[s].cos,
            y + r * OCT_OFFSETS[s].sin
          );
        }
        ctx.fill();
      }
    }

    // Warmup
    for (let i = 0; i < 20; i++) {
      drawArcs();
      drawRects();
      drawSquares();
      drawHexagons();
      drawOctagons();
    }

    // Benchmark helper
    function bench(fn, label) {
      const t = performance.now();
      for (let f = 0; f < FRAMES; f++) fn();
      return performance.now() - t;
    }

    const arcTime = bench(drawArcs, 'arc');
    const rectTime = bench(drawRects, 'fillRect');
    const squareTime = bench(drawSquares, 'square 4pt');
    const hexTime = bench(drawHexagons, 'hexagon');
    const octTime = bench(drawOctagons, 'octagon');
    // Results
    const times = [
      { name: 'arc() — individual beginPath/fill', time: arcTime },
      { name: 'fillRect() — axis-aligned square', time: rectTime },
      { name: 'Rotated square (4 lineTo)', time: squareTime },
      { name: 'Hexagon (6 lineTo)', time: hexTime },
      { name: 'Octagon (8 lineTo)', time: octTime },
    ];
    times.sort((a, b) => a.time - b.time);

    let results = `Shape Benchmark — ${SHAPES} shapes x ${FRAMES} frames\n`;
    results += `=`.repeat(65) + '\n\n';

    for (const t of times) {
      const bar = '#'.repeat(Math.round(t.time / times[times.length - 1].time * 30));
      const fps = (FRAMES / (t.time / 1000)).toFixed(0);
      const pad = t.name.padEnd(45);
      results += `${pad} ${t.time.toFixed(0).padStart(6)}ms  ~${fps}fps  ${bar}\n`;
    }

    results += `\nFastest: ${times[0].name}`;
    results += `\nSlowest: ${times[times.length - 1].name}`;
    results += `\nSpeedup: ${(times[times.length - 1].time / times[0].time).toFixed(2)}x`;

    document.getElementById('results').textContent = results;
    console.log(results);
  </script>
</body>
</html>
