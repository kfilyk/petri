<!DOCTYPE html>
<html>
<head>
  <title>Math.min/max vs Ternary Clamp Benchmark</title>
</head>
<body>
  <pre id="results">Running...</pre>
  <script>
    const ITERATIONS = 100_000_000;

    // Generate test data: mix of values inside and outside [-1, 1]
    const DATA_SIZE = 10000;
    const data = new Float64Array(DATA_SIZE);
    for (let i = 0; i < DATA_SIZE; i++) {
      // Mix of values: ~70% within range, ~30% outside
      data[i] = (Math.random() - 0.5) * 4; // range [-2, 2]
    }

    // Method 1: Math.min(Math.max())
    function clampMathMinMax(x) {
      return Math.min(Math.max(x, -1), 1);
    }

    // Method 2: Ternary chain
    function clampTernary(x) {
      return x < -1 ? -1 : x > 1 ? 1 : x;
    }

    // Prevent dead code elimination
    let sink = 0;

    // Warmup all paths
    for (let i = 0; i < 100000; i++) {
      const v = data[i % DATA_SIZE];
      sink += clampMathMinMax(v);
      sink += clampTernary(v);
    }
    sink = 0;

    // Benchmark Math.min(Math.max())
    const t1 = performance.now();
    for (let i = 0; i < ITERATIONS; i++) {
      sink += clampMathMinMax(data[i % DATA_SIZE]);
    }
    const mathTime = performance.now() - t1;
    sink = 0;

    // Benchmark ternary
    const t2 = performance.now();
    for (let i = 0; i < ITERATIONS; i++) {
      sink += clampTernary(data[i % DATA_SIZE]);
    }
    const ternaryTime = performance.now() - t2;
    sink = 0;

    // Benchmark inline Math.min(Math.max()) - no function call
    const t3 = performance.now();
    for (let i = 0; i < ITERATIONS; i++) {
      const x = data[i % DATA_SIZE];
      sink += Math.min(Math.max(x, -1), 1);
    }
    const inlineMathTime = performance.now() - t3;
    sink = 0;

    // Benchmark inline ternary - no function call
    const t4 = performance.now();
    for (let i = 0; i < ITERATIONS; i++) {
      const x = data[i % DATA_SIZE];
      sink += x < -1 ? -1 : x > 1 ? 1 : x;
    }
    const inlineTernaryTime = performance.now() - t4;
    sink = 0;

    // Results
    const times = [
      { name: 'Math.min(Math.max()) in function', time: mathTime },
      { name: 'Ternary in function', time: ternaryTime },
      { name: 'Inline Math.min(Math.max())', time: inlineMathTime },
      { name: 'Inline ternary', time: inlineTernaryTime },
    ];
    times.sort((a, b) => a.time - b.time);

    let results = `Clamp to [-1, 1] Benchmark — ${(ITERATIONS / 1e6).toFixed(0)}M iterations\n`;
    results += `=`.repeat(60) + '\n\n';

    for (const t of times) {
      const bar = '#'.repeat(Math.round(t.time / times[times.length - 1].time * 30));
      const pad = t.name.padEnd(40);
      results += `${pad} ${t.time.toFixed(1).padStart(7)}ms  ${bar}\n`;
    }

    results += `\nFastest: ${times[0].name}`;
    results += `\nSlowest: ${times[times.length - 1].name}`;
    results += `\nSpeedup: ${(times[times.length - 1].time / times[0].time).toFixed(2)}x`;

    // Verify correctness
    results += '\n\n--- Correctness check ---\n';
    const testValues = [-2, -1, -0.5, 0, 0.5, 1, 2];
    for (const v of testValues) {
      const m = Math.min(Math.max(v, -1), 1);
      const t = v < -1 ? -1 : v > 1 ? 1 : v;
      const match = m === t ? 'OK' : 'MISMATCH';
      results += `v=${v.toString().padStart(4)}: Math=${m.toString().padStart(2)}, Ternary=${t.toString().padStart(2)} [${match}]\n`;
    }

    document.getElementById('results').textContent = results;
    console.log(results);
  </script>
</body>
</html>
