<!DOCTYPE html>
<html>
<head>
  <title>Rotation Debug v2</title>
</head>
<body>
  <pre id="results">Running...</pre>
  <script>
    const DEG_TO_RAD = 0.0174533;

    // Original polar method (exact copy from code)
    function movePolar(animalDir, animalX, animalY, eyeX, eyeY) {
      const angle = Math.atan(eyeX / (eyeY + 0.001)) / DEG_TO_RAD;
      const dist = Math.sqrt(eyeX ** 2 + eyeY ** 2);
      const adjustedAngle = eyeX < 0 ? angle + 180 : angle;

      const x = animalX + dist * Math.cos(DEG_TO_RAD * (adjustedAngle + animalDir));
      const y = animalY + dist * Math.sin(DEG_TO_RAD * (adjustedAngle + animalDir));
      return { x, y };
    }

    // The key insight: atan(x/y) gives angle from Y-axis, not X-axis
    // And the +180 when x<0 handles the fact that atan only returns -90 to +90
    // This is essentially atan2(eyeX, eyeY) but manual

    // Let's use atan2 properly:
    // atan2(y, x) gives angle from positive X-axis
    // atan2(x, y) gives angle from positive Y-axis (what the original does)

    function moveMatrix_v2(animalDir, animalX, animalY, eyeX, eyeY) {
      // Get angle of eye offset from Y-axis (same as original)
      const eyeAngleDeg = Math.atan2(eyeX, eyeY) / DEG_TO_RAD;
      const dist = Math.sqrt(eyeX * eyeX + eyeY * eyeY);
      const finalAngle = (eyeAngleDeg + animalDir) * DEG_TO_RAD;

      const x = animalX + dist * Math.cos(finalAngle);
      const y = animalY + dist * Math.sin(finalAngle);
      return { x, y };
    }

    // Test cases
    let results = 'Rotation Debug v2 - Using atan2\n';
    results += '================================\n\n';

    const testCases = [
      { eyeX: 0, eyeY: 10, dir: 0, desc: 'Eye forward, dir=0' },
      { eyeX: 0, eyeY: 10, dir: 90, desc: 'Eye forward, dir=90' },
      { eyeX: 10, eyeY: 0, dir: 0, desc: 'Eye right, dir=0' },
      { eyeX: -10, eyeY: 0, dir: 0, desc: 'Eye left, dir=0' },
      { eyeX: 10, eyeY: 10, dir: 0, desc: 'Eye diagonal FR, dir=0' },
      { eyeX: -10, eyeY: 10, dir: 0, desc: 'Eye diagonal FL, dir=0' },
      { eyeX: 10, eyeY: -10, dir: 0, desc: 'Eye diagonal BR, dir=0' },
      { eyeX: -10, eyeY: -10, dir: 0, desc: 'Eye diagonal BL, dir=0' },
      { eyeX: 5, eyeY: 8, dir: 45, desc: 'Random case 1' },
      { eyeX: -3, eyeY: 12, dir: 120, desc: 'Random case 2' },
      { eyeX: 7, eyeY: -4, dir: 200, desc: 'Random case 3' },
    ];

    for (const tc of testCases) {
      const polar = movePolar(tc.dir, 100, 100, tc.eyeX, tc.eyeY);
      const matrix = moveMatrix_v2(tc.dir, 100, 100, tc.eyeX, tc.eyeY);
      const xDiff = Math.abs(polar.x - matrix.x);
      const yDiff = Math.abs(polar.y - matrix.y);
      const match = (xDiff < 0.01 && yDiff < 0.01) ? 'OK' : 'DIFF';

      results += `${tc.desc}\n`;
      results += `  eye=(${tc.eyeX}, ${tc.eyeY}), dir=${tc.dir}\n`;
      results += `  Polar:  (${polar.x.toFixed(4)}, ${polar.y.toFixed(4)})\n`;
      results += `  Matrix: (${matrix.x.toFixed(4)}, ${matrix.y.toFixed(4)})\n`;
      results += `  [${match}] diff: x=${xDiff.toFixed(6)}, y=${yDiff.toFixed(6)}\n\n`;
    }

    // If atan2 version works, let's see if we can optimize further
    // by avoiding atan2 entirely with pure rotation matrix
    results += '\n=== Can we avoid trig on eyeX/eyeY entirely? ===\n\n';
    results += 'The polar method computes:\n';
    results += '  1. angle = atan2(eyeX, eyeY)  -- angle of offset from Y-axis\n';
    results += '  2. dist = sqrt(eyeX² + eyeY²)\n';
    results += '  3. finalAngle = angle + animalDir\n';
    results += '  4. x = animalX + dist * cos(finalAngle)\n';
    results += '  5. y = animalY + dist * sin(finalAngle)\n\n';
    results += 'Using angle addition formulas:\n';
    results += '  cos(a + b) = cos(a)cos(b) - sin(a)sin(b)\n';
    results += '  sin(a + b) = sin(a)cos(b) + cos(a)sin(b)\n\n';
    results += 'Where a = atan2(eyeX, eyeY), so:\n';
    results += '  cos(a) = eyeY / dist\n';
    results += '  sin(a) = eyeX / dist\n\n';
    results += 'Substituting:\n';
    results += '  cos(finalAngle) = (eyeY/dist)*cos(dir) - (eyeX/dist)*sin(dir)\n';
    results += '  sin(finalAngle) = (eyeX/dist)*cos(dir) + (eyeY/dist)*sin(dir)\n\n';
    results += 'So:\n';
    results += '  x = animalX + dist * [(eyeY/dist)*cos(dir) - (eyeX/dist)*sin(dir)]\n';
    results += '  x = animalX + eyeY*cos(dir) - eyeX*sin(dir)\n\n';
    results += '  y = animalY + dist * [(eyeX/dist)*cos(dir) + (eyeY/dist)*sin(dir)]\n';
    results += '  y = animalY + eyeX*cos(dir) + eyeY*sin(dir)\n\n';

    // Pure rotation matrix based on the math above
    function moveMatrixPure(animalDir, animalX, animalY, eyeX, eyeY) {
      const rad = animalDir * DEG_TO_RAD;
      const cos = Math.cos(rad);
      const sin = Math.sin(rad);
      const x = animalX + eyeY * cos - eyeX * sin;
      const y = animalY + eyeX * cos + eyeY * sin;
      return { x, y };
    }

    results += '=== Testing pure rotation matrix ===\n\n';
    for (const tc of testCases) {
      const polar = movePolar(tc.dir, 100, 100, tc.eyeX, tc.eyeY);
      const matrix = moveMatrixPure(tc.dir, 100, 100, tc.eyeX, tc.eyeY);
      const xDiff = Math.abs(polar.x - matrix.x);
      const yDiff = Math.abs(polar.y - matrix.y);
      const match = (xDiff < 0.01 && yDiff < 0.01) ? 'OK' : 'DIFF';

      results += `${tc.desc}: [${match}] diff=(${xDiff.toFixed(6)}, ${yDiff.toFixed(6)})\n`;
    }

    document.getElementById('results').textContent = results;
  </script>
</body>
</html>
